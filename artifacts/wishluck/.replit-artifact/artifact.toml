kind = "web"
previewPath = "/"
title = "Wishluck"
description = "AI landing page studio for Shopify brands: product and brand analysis, competitor intelligence, distinct editable Liquid designs, persistent layout memory and safe theme publishing."
version = "1.0.0"
id = "artifacts/wishluck"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26074

[services.development]
run = "pnpm --filter @workspace/wishluck run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wishluck", "run", "build" ]
serve = "static"
publicDir = "artifacts/wishluck/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26074"
BASE_PATH = "/"
